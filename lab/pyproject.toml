[project]
name = "gridlab"
version = "0.1.0"
description = "Generative/editing toolkit for gridpaint blob designs (laser-cut layered jewellery)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pillow"]

[project.scripts]
gridlab = "gridlab.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
